name: GitHub Language Stats

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-language-stats
  cancel-in-progress: true

jobs:
  generate-language-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate language stats
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: selee1012

        run: |
          python3 <<'PY'
          import base64
          import collections
          import html
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          OUTPUT_FILE = "language-stats.svg"
          MAX_LANGUAGES = 0
          MIN_PERCENT = 0.1

          # 언어별 확장자 및 색상
          LANGUAGES = {
              ".java": ("Java", "#b07219"),
              ".kt": ("Kotlin", "#A97BFF"),
              ".kts": ("Kotlin", "#A97BFF"),
              ".py": ("Python", "#3572A5"),
              ".pyi": ("Python", "#3572A5"),
              ".js": ("JavaScript", "#f1e05a"),
              ".jsx": ("JavaScript", "#f1e05a"),
              ".mjs": ("JavaScript", "#f1e05a"),
              ".cjs": ("JavaScript", "#f1e05a"),
              ".ts": ("TypeScript", "#3178c6"),
              ".tsx": ("TypeScript", "#3178c6"),
              ".go": ("Go", "#00ADD8"),
              ".rs": ("Rust", "#dea584"),
              ".c": ("C", "#555555"),
              ".h": ("C", "#555555"),
              ".cc": ("C++", "#f34b7d"),
              ".cpp": ("C++", "#f34b7d"),
              ".cxx": ("C++", "#f34b7d"),
              ".hpp": ("C++", "#f34b7d"),
              ".hxx": ("C++", "#f34b7d"),
              ".cs": ("C#", "#178600"),
              ".swift": ("Swift", "#F05138"),
              ".dart": ("Dart", "#00B4AB"),
              ".rb": ("Ruby", "#701516"),
              ".php": ("PHP", "#4F5D95"),
              ".scala": ("Scala", "#c22d40"),
              ".sql": ("SQL", "#e38c00"),
              ".sh": ("Shell", "#89e051"),
              ".bash": ("Shell", "#89e051"),
              ".r": ("R", "#198CE7"),
          }

          # 통계에서 제외할 디렉터리
          IGNORED_DIRS = {
              "node_modules",
              ".gradle",
              ".idea",
              ".next",
              ".github",
              "build",
              "dist",
              "target",
              "coverage",
              "vendor",
              "generated",
              "__pycache__",
              ".venv",
          }

          def language_for_path(path):
              parts = pathlib.PurePosixPath(path).parts

              if any(
                  p.lower() in IGNORED_DIRS
                  for p in parts[:-1]
              ):
                  return None

              if path.lower().endswith((
                  ".min.js",
                  ".min.css",
              )):
                  return None

              extension = pathlib.PurePosixPath(
                  path
              ).suffix.lower()

              return LANGUAGES.get(extension)

          def api_request(url, payload=None):
              data = (
                  None
                  if payload is None
                  else json.dumps(payload).encode()
              )

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "github-language-stats",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method=(
                      "POST"
                      if payload is not None
                      else "GET"
                  ),
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60,
                  ) as response:
                      return json.load(response)

              except urllib.error.HTTPError as exc:
                  message = exc.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  raise RuntimeError(
                      f"GitHub API {exc.code}: {message}"
                  ) from exc

          def graphql(query, variables):
              result = api_request(
                  "https://api.github.com/graphql",
                  {
                      "query": query,
                      "variables": variables,
                  },
              )

              if result.get("errors"):
                  raise RuntimeError(
                      json.dumps(
                          result["errors"],
                          ensure_ascii=False,
                      )
                  )

              return result["data"]

          def contribution_years():
              query = """
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionYears
                  }
                }
              }
              """

              data = graphql(
                  query,
                  {"login": USERNAME},
              )

              return (
                  data["user"]
                  ["contributionsCollection"]
                  ["contributionYears"]
              )

          def contributions_in_period(start, end):
              query = """
              query(
                $login: String!,
                $from: DateTime!,
                $to: DateTime!
              ) {
                user(login: $login) {
                  contributionsCollection(
                    from: $from,
                    to: $to
                  ) {
                    commitContributionsByRepository(
                      maxRepositories: 100
                    ) {
                      repository {
                        nameWithOwner
                      }
                    }
                  }
                }
              }
              """

              result = graphql(
                  query,
                  {
                      "login": USERNAME,
                      "from": start,
                      "to": end,
                  },
              )

              return (
                  result["user"]
                  ["contributionsCollection"]
                  ["commitContributionsByRepository"]
              )

          def find_repositories():
              now = datetime.now(timezone.utc)
              names = set()

              for year in sorted(contribution_years()):
                  start = f"{year}-01-01T00:00:00Z"

                  if year == now.year:
                      end = now.strftime(
                          "%Y-%m-%dT%H:%M:%SZ"
                      )
                  else:
                      end = (
                          f"{year}-12-31T23:59:59Z"
                      )

                  try:
                      nodes = contributions_in_period(
                          start,
                          end,
                      )

                  except RuntimeError:
                      first_end = (
                          f"{year}-06-30T23:59:59Z"
                      )

                      nodes = contributions_in_period(
                          start,
                          first_end,
                      )

                      if (
                          year < now.year
                          or now.month >= 7
                      ):
                          second_start = (
                              f"{year}-07-01T00:00:00Z"
                          )

                          nodes += contributions_in_period(
                              second_start,
                              end,
                          )

                  for node in nodes:
                      names.add(
                          node["repository"]["nameWithOwner"]
                      )

              return sorted(names)

          def user_commit_shas(repo):
              # 본인이 작성한 기본 브랜치 커밋 조회
              shas = []
              page = 1

              while True:
                  params = urllib.parse.urlencode({
                      "author": USERNAME,
                      "per_page": 100,
                      "page": page,
                  })

                  url = (
                      f"https://api.github.com/repos/"
                      f"{repo}/commits?{params}"
                  )

                  rows = api_request(url)

                  if not isinstance(rows, list):
                      raise RuntimeError(
                          f"Unexpected API response: {repo}"
                      )

                  shas.extend(
                      item["sha"]
                      for item in rows
                  )

                  if len(rows) < 100:
                      break

                  page += 1

              return list(dict.fromkeys(shas))

          def commit_changes(repo, shas, temp_root):
              # REST API를 커밋마다 호출하지 않고
              # Git으로 변경 라인 수를 분석
              local_dir = os.path.join(
                  temp_root,
                  "repository",
              )

              basic = base64.b64encode(
                  f"x-access-token:{TOKEN}".encode()
              ).decode()

              remote = f"https://github.com/{repo}.git"

              clone = subprocess.run(
                  [
                      "git",
                      "-c",
                      (
                          "http.extraheader="
                          f"AUTHORIZATION: basic {basic}"
                      ),
                      "clone",
                      "--quiet",
                      "--single-branch",
                      "--filter=blob:none",
                      "--no-checkout",
                      remote,
                      local_dir,
                  ],
                  capture_output=True,
                  text=True,
              )

              if clone.returncode:
                  raise RuntimeError(
                      f"Failed to clone {repo}: "
                      f"{clone.stderr.strip()}"
                  )

              command = [
                  "git",
                  "-C",
                  local_dir,
                  "-c",
                  (
                      "http.extraheader="
                      f"AUTHORIZATION: basic {basic}"
                  ),
                  "diff-tree",
                  "--stdin",
                  "--root",
                  "--numstat",
                  "-r",
                  "-M",
                  "-z",
              ]

              result = subprocess.run(
                  command,
                  input=(
                      "\n".join(shas) + "\n"
                  ).encode(),
                  capture_output=True,
              )

              if result.returncode:
                  error = result.stderr.decode(
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"Failed to calculate diffs "
                      f"for {repo}: {error}"
                  )

              changes_by_commit = {}
              current_sha = None

              tokens = iter(
                  result.stdout.split(b"\0")
              )

              for entry in tokens:
                  if not entry:
                      continue

                  value = entry.decode(
                      "utf-8",
                      errors="replace",
                  )

                  if re.fullmatch(
                      r"[0-9a-f]{40}",
                      value,
                  ):
                      current_sha = value

                      changes_by_commit[current_sha] = (
                          collections.Counter()
                      )
                      continue

                  if current_sha is None:
                      continue

                  parts = value.split("\t", 2)

                  if len(parts) != 3:
                      continue

                  additions, deletions, path = parts

                  # Git rename 경로 처리
                  if not path:
                      next(tokens, b"")

                      path = next(
                          tokens,
                          b"",
                      ).decode(
                          "utf-8",
                          errors="replace",
                      )

                  # 바이너리 파일 제외
                  if (
                      not additions.isdigit()
                      or not deletions.isdigit()
                  ):
                      continue

                  detected = language_for_path(path)

                  if detected is None:
                      continue

                  name, _ = detected

                  changed_lines = (
                      int(additions) + int(deletions)
                  )

                  changes_by_commit[
                      current_sha
                  ][name] += changed_lines

              return changes_by_commit

          def calculate_stats():
              language_scores = (
                  collections.defaultdict(float)
              )

              used_commits = 0
              repositories = find_repositories()

              print(
                  f"Discovered {len(repositories)} "
                  f"repositories",
                  flush=True,
              )

              for index, repo in enumerate(
                  repositories,
                  start=1,
              ):
                  shas = user_commit_shas(repo)

                  if not shas:
                      continue

                  print(
                      f"[{index}/{len(repositories)}] "
                      f"{repo}: {len(shas)} commits",
                      flush=True,
                  )

                  with tempfile.TemporaryDirectory() as folder:
                      changes_by_commit = commit_changes(
                          repo,
                          shas,
                          folder,
                      )

                  for sha in shas:
                      changes = changes_by_commit.get(
                          sha,
                          {},
                      )

                      total_changed_lines = sum(
                          changes.values()
                      )

                      # 코드 변경이 없는 커밋 제외
                      if total_changed_lines == 0:
                          continue

                      used_commits += 1

                      for language, lines in changes.items():
                          # 커밋 1개를 언어별 비중으로 분배
                          language_scores[language] += (
                              lines / total_changed_lines
                          )

              return language_scores, used_commits

          def make_svg(scores, total):
              items = sorted(
                  scores.items(),
                  key=lambda row: row[1],
                  reverse=True,
              )

              # 0.1% 이하 언어 표시 제외
              items = [
                  (name, score)
                  for name, score in items
                  if total
                  and score / total * 100 > MIN_PERCENT
              ]

              if MAX_LANGUAGES > 0:
                  items = items[:MAX_LANGUAGES]

              width = 760
              row_height = 32

              height = (
                  92
                  + row_height * max(1, len(items))
              )

              colors = {
                  name: color
                  for name, color in LANGUAGES.values()
              }

              rows = []

              for idx, (name, score) in enumerate(items):
                  y = 60 + idx * row_height

                  pct = score / total * 100

                  bar_width = max(
                      2,
                      470 * pct / 100,
                  )

                  color = colors.get(
                      name,
                      "#8b949e",
                  )

                  rows.append(f'''
                    <text
                      x="20"
                      y="{y + 13}"
                      class="label">
                      {html.escape(name)}
                    </text>

                    <rect
                      x="165"
                      y="{y}"
                      width="470"
                      height="16"
                      rx="4"
                      class="bar-bg"
                    />

                    <rect
                      x="165"
                      y="{y}"
                      width="{bar_width:.2f}"
                      height="16"
                      rx="4"
                      fill="{html.escape(color)}"
                    />

                    <text
                      x="735"
                      y="{y + 13}"
                      text-anchor="end"
                      class="percent">
                      {pct:.1f}%
                    </text>
                  ''')

              if not items:
                  rows = [
                      '<text x="20" y="75" '
                      'class="label">'
                      'No code commits found.'
                      '</text>'
                  ]

              return f'''
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="{width}"
                height="{height}"
                viewBox="0 0 {width} {height}">

                <style>
                  .title {{
                    font: 600 20px
                    -apple-system,BlinkMacSystemFont,
                    "Segoe UI",Helvetica,Arial,
                    sans-serif;
                    fill: #24292f;
                  }}

                  .label {{
                    font: 500 13px
                    -apple-system,BlinkMacSystemFont,
                    "Segoe UI",Helvetica,Arial,
                    sans-serif;
                    fill: #24292f;
                  }}

                  .percent {{
                    font: 500 13px
                    -apple-system,BlinkMacSystemFont,
                    "Segoe UI",Helvetica,Arial,
                    sans-serif;
                    fill: #57606a;
                  }}

                  .footer {{
                    font: 11px
                    -apple-system,BlinkMacSystemFont,
                    "Segoe UI",Helvetica,Arial,
                    sans-serif;
                    fill: #8c959f;
                  }}

                  .bar-bg {{
                    fill: #eaeef2;
                  }}

                  @media (prefers-color-scheme:dark) {{
                    .title,.label {{
                      fill: #f0f6fc;
                    }}
                    .percent {{
                      fill: #c9d1d9;
                    }}
                    .footer {{
                      fill: #8b949e;
                    }}
                    .bar-bg {{
                      fill: #30363d;
                    }}
                  }}
                </style>

                <text
                  x="20"
                  y="30"
                  class="title">
                  Most Used Languages
                </text>

                {''.join(rows)}

                <text
                  x="20"
                  y="{height - 12}"
                  class="footer">
                  Based on personal commits ·
                  Changes split by language ·
                  HTML/CSS excluded
                </text>
              </svg>
              '''

          scores, total_commits = calculate_stats()

          print(
              f"Code commits analyzed: {total_commits}"
          )

          for name, score in sorted(
              scores.items(),
              key=lambda row: row[1],
              reverse=True,
          ):
              if total_commits:
                  percentage = (
                      score / total_commits * 100
                  )

                  print(
                      f"{name:18} "
                      f"{percentage:6.2f}%"
                  )

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8",
          ) as file:
              file.write(
                  make_svg(scores, total_commits)
              )

          print(f"Created {OUTPUT_FILE}")
          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add language-stats.svg

          if git diff --cached --quiet; then
            echo "No changes in language stats."
            exit 0
          fi

          git commit -m "chore: update language statistics"
          git push
