name: GitHub Language Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: selee1012
          BRANCH_NAME: main
          UTC_OFFSET: 9
          EXCLUDE: "html,css"
          AUTO_PUSH: true
          THEME: "default"
