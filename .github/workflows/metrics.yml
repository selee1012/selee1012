name: GitHub Language Stats

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-language-stats
  cancel-in-progress: true

jobs:
  generate-language-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate language stats
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: selee1012
        run: |
          python3 <<'PY'
          import base64
          import collections
          import html
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]
          OUTPUT_FILE = "language-stats.svg"
          MIN_PERCENT = 1.0

          # 프로그래밍 언어만 포함
          # SQL, Shell, HTML, CSS 등은 제외
          LANGUAGES = {
              ".java": ("Java", "#b07219"),
              ".kt": ("Kotlin", "#A97BFF"),
              ".kts": ("Kotlin", "#A97BFF"),
              ".py": ("Python", "#3572A5"),
              ".pyi": ("Python", "#3572A5"),
              ".js": ("JavaScript", "#f1e05a"),
              ".jsx": ("JavaScript", "#f1e05a"),
              ".mjs": ("JavaScript", "#f1e05a"),
              ".cjs": ("JavaScript", "#f1e05a"),
              ".ts": ("TypeScript", "#3178c6"),
              ".tsx": ("TypeScript", "#3178c6"),
              ".go": ("Go", "#00ADD8"),
              ".rs": ("Rust", "#dea584"),
              ".c": ("C", "#555555"),
              ".h": ("C", "#555555"),
              ".cc": ("C++", "#f34b7d"),
              ".cpp": ("C++", "#f34b7d"),
              ".cxx": ("C++", "#f34b7d"),
              ".hpp": ("C++", "#f34b7d"),
              ".hxx": ("C++", "#f34b7d"),
              ".cs": ("C#", "#178600"),
              ".swift": ("Swift", "#F05138"),
              ".dart": ("Dart", "#00B4AB"),
              ".rb": ("Ruby", "#701516"),
              ".php": ("PHP", "#4F5D95"),
              ".scala": ("Scala", "#c22d40"),
          }

          IGNORED_DIRS = {
              "node_modules",
              ".gradle",
              ".idea",
              ".next",
              ".github",
              "build",
              "dist",
              "target",
              "coverage",
              "vendor",
              "generated",
              "__pycache__",
              ".venv",
          }

          def language_for_path(path):
              parts = pathlib.PurePosixPath(path).parts

              if any(
                  p.lower() in IGNORED_DIRS
                  for p in parts[:-1]
              ):
                  return None

              if path.lower().endswith(".min.js"):
                  return None

              extension = pathlib.PurePosixPath(
                  path
              ).suffix.lower()

              return LANGUAGES.get(extension)

          def api_request(url, payload=None):
              data = (
                  None
                  if payload is None
                  else json.dumps(payload).encode("utf-8")
              )

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "github-language-stats",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method=(
                      "POST"
                      if payload is not None
                      else "GET"
                  ),
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60,
                  ) as response:
                      return json.load(response)

              except urllib.error.HTTPError as error:
                  message = error.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  raise RuntimeError(
                      f"GitHub API {error.code}: {message}"
                  ) from error

          def graphql(query, variables):
              result = api_request(
                  "https://api.github.com/graphql",
                  {
                      "query": query,
                      "variables": variables,
                  },
              )

              if result.get("errors"):
                  raise RuntimeError(
                      json.dumps(
                          result["errors"],
                          ensure_ascii=False,
                      )
                  )

              return result["data"]

          def contribution_years():
              query = """
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionYears
                  }
                }
              }
              """

              data = graphql(
                  query,
                  {"login": USERNAME},
              )

              return (
                  data["user"]
                  ["contributionsCollection"]
                  ["contributionYears"]
              )

          def contributions_in_period(start, end):
              query = """
              query(
                $login: String!,
                $from: DateTime!,
                $to: DateTime!
              ) {
                user(login: $login) {
                  contributionsCollection(
                    from: $from,
                    to: $to
                  ) {
                    commitContributionsByRepository(
                      maxRepositories: 100
                    ) {
                      repository {
                        nameWithOwner
                      }
                    }
                  }
                }
              }
              """

              data = graphql(
                  query,
                  {
                      "login": USERNAME,
                      "from": start,
                      "to": end,
                  },
              )

              return (
                  data["user"]
                  ["contributionsCollection"]
                  ["commitContributionsByRepository"]
              )

          def find_repositories():
              now = datetime.now(timezone.utc)
              names = set()

              for year in sorted(contribution_years()):
                  start = f"{year}-01-01T00:00:00Z"

                  end = (
                      now.strftime(
                          "%Y-%m-%dT%H:%M:%SZ"
                      )
                      if year == now.year
                      else f"{year}-12-31T23:59:59Z"
                  )

                  try:
                      nodes = contributions_in_period(
                          start,
                          end,
                      )

                  except RuntimeError:
                      nodes = contributions_in_period(
                          start,
                          f"{year}-06-30T23:59:59Z",
                      )

                      if (
                          year < now.year
                          or now.month >= 7
                      ):
                          nodes += contributions_in_period(
                              f"{year}-07-01T00:00:00Z",
                              end,
                          )

                  for node in nodes:
                      names.add(
                          node["repository"]["nameWithOwner"]
                      )

              return sorted(names)

          def user_commit_shas(repo):
              # 기본 브랜치에서 본인이 작성한 커밋 조회
              shas = []
              page = 1

              while True:
                  params = urllib.parse.urlencode({
                      "author": USERNAME,
                      "per_page": 100,
                      "page": page,
                  })

                  rows = api_request(
                      f"https://api.github.com/repos/"
                      f"{repo}/commits?{params}"
                  )

                  if not isinstance(rows, list):
                      raise RuntimeError(
                          f"Unexpected commits response for {repo}"
                      )

                  shas.extend(
                      row["sha"]
                      for row in rows
                  )

                  if len(rows) < 100:
                      break

                  page += 1

              return list(dict.fromkeys(shas))

          def commit_changes(repo, shas, temp_root):
              local_dir = os.path.join(
                  temp_root,
                  "repository",
              )

              basic = base64.b64encode(
                  f"x-access-token:{TOKEN}".encode()
              ).decode()

              auth_header = (
                  f"http.extraheader="
                  f"AUTHORIZATION: basic {basic}"
              )

              remote = f"https://github.com/{repo}.git"

              cloned = subprocess.run(
                  [
                      "git",
                      "-c",
                      auth_header,
                      "clone",
                      "--quiet",
                      "--single-branch",
                      "--filter=blob:none",
                      "--no-checkout",
                      remote,
                      local_dir,
                  ],
                  capture_output=True,
                  text=True,
              )

              if cloned.returncode:
                  raise RuntimeError(
                      f"Failed to clone {repo}: "
                      f"{cloned.stderr.strip()}"
                  )

              # 모든 커밋의 파일별 변경량 조회
              command = [
                  "git",
                  "-C",
                  local_dir,
                  "-c",
                  auth_header,
                  "diff-tree",
                  "--stdin",
                  "--root",
                  "--numstat",
                  "-r",
                  "-M",
                  "-z",
              ]

              result = subprocess.run(
                  command,
                  input=(
                      "\n".join(shas) + "\n"
                  ).encode(),
                  capture_output=True,
              )

              if result.returncode:
                  error = result.stderr.decode(
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"Failed to read changes for "
                      f"{repo}: {error}"
                  )

              changes_by_commit = {}
              current_sha = None

              tokens = iter(
                  result.stdout.split(b"\0")
              )

              for entry in tokens:
                  if not entry:
                      continue

                  value = entry.decode(
                      "utf-8",
                      errors="replace",
                  )

                  if re.fullmatch(
                      r"[0-9a-f]{40}",
                      value,
                  ):
                      current_sha = value

                      changes_by_commit[current_sha] = (
                          collections.Counter()
                      )
                      continue

                  if current_sha is None:
                      continue

                  fields = value.split("\t", 2)

                  if len(fields) != 3:
                      continue

                  additions, deletions, path = fields

                  if not path:
                      # 파일 이름 변경 처리
                      next(tokens, b"")

                      path = next(
                          tokens,
                          b"",
                      ).decode(
                          "utf-8",
                          errors="replace",
                      )

                  # 바이너리 파일 제외
                  if (
                      not additions.isdigit()
                      or not deletions.isdigit()
                  ):
                      continue

                  detected = language_for_path(path)

                  if detected is None:
                      continue

                  language, _ = detected

                  changes_by_commit[
                      current_sha
                  ][language] += (
                      int(additions) + int(deletions)
                  )

              return changes_by_commit

          def collect_language_stats():
              scores = collections.defaultdict(float)
              used_commits = 0

              repositories = find_repositories()

              print(
                  f"Found {len(repositories)} repositories",
                  flush=True,
              )

              for index, repo in enumerate(
                  repositories,
                  start=1,
              ):
                  shas = user_commit_shas(repo)

                  if not shas:
                      continue

                  print(
                      f"[{index}/{len(repositories)}] "
                      f"{repo}: {len(shas)} commits",
                      flush=True,
                  )

                  with tempfile.TemporaryDirectory() as directory:
                      changes_by_commit = commit_changes(
                          repo,
                          shas,
                          directory,
                      )

                  for sha in shas:
                      changes = changes_by_commit.get(
                          sha,
                          {},
                      )

                      total_lines = sum(
                          changes.values()
                      )

                      # 프로그래밍 코드 변경이 없는 커밋 제외
                      if total_lines == 0:
                          continue

                      used_commits += 1

                      for language, lines in changes.items():
                          # 커밋 1개를 변경량 비율로 분배
                          scores[language] += (
                              lines / total_lines
                          )

              return scores, used_commits

          def make_svg(scores, total):
              # 1.0% 이상 언어만 표시
              # 숨긴 언어도 전체 비율의 분모에는 포함
              items = sorted(
                  (
                      (name, score)
                      for name, score in scores.items()
                      if total > 0
                      and (
                          score / total * 100
                      ) >= MIN_PERCENT
                  ),
                  key=lambda pair: pair[1],
                  reverse=True,
              )

              width = 760
              height = (
                  54
                  + 32 * max(len(items), 1)
                  + 35
              )

              colors = {
                  name: color
                  for name, color in LANGUAGES.values()
              }

              rows = []

              for index, (language, score) in enumerate(items):
                  y = 54 + 32 * index

                  percentage = (
                      score / total * 100
                  )

                  bar_width = max(
                      2,
                      470 * percentage / 100,
                  )

                  rows.append(f'''
                    <text
                      x="20"
                      y="{y + 20}"
                      class="label">
                      {html.escape(language)}
                    </text>

                    <rect
                      x="165"
                      y="{y + 7}"
                      width="470"
                      height="16"
                      rx="4"
                      class="bar-bg"
                    />

                    <rect
                      x="165"
                      y="{y + 7}"
                      width="{bar_width:.2f}"
                      height="16"
                      rx="4"
                      fill="{html.escape(colors[language])}"
                    />

                    <text
                      x="735"
                      y="{y + 20}"
                      text-anchor="end"
                      class="percent">
                      {percentage:.1f}%
                    </text>
                  ''')

              if not items:
                  rows.append(
                      '<text x="20" y="75" class="label">'
                      'No languages at or above 1%.'
                      '</text>'
                  )

              return f'''
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="{width}"
                height="{height}"
                viewBox="0 0 {width} {height}">

                <style>
                  .title {{
                    font: 600 20px
                    -apple-system,BlinkMacSystemFont,
                    "Segoe UI",Helvetica,Arial,sans-serif;
                    fill: #24292f;
                  }}

                  .label {{
                    font: 500 13px
                    -apple-system,BlinkMacSystemFont,
                    "Segoe UI",Helvetica,Arial,sans-serif;
                    fill: #24292f;
                  }}

                  .percent {{
                    font: 500 13px
                    -apple-system,BlinkMacSystemFont,
                    "Segoe UI",Helvetica,Arial,sans-serif;
                    fill: #57606a;
                  }}

                  .footer {{
                    font: 11px
                    -apple-system,BlinkMacSystemFont,
                    "Segoe UI",Helvetica,Arial,sans-serif;
                    fill: #8c959f;
                  }}

                  .bar-bg {{
                    fill: #eaeef2;
                  }}

                  @media (prefers-color-scheme: dark) {{
                    .title,.label {{
                      fill: #f0f6fc;
                    }}

                    .percent {{
                      fill: #c9d1d9;
                    }}

                    .footer {{
                      fill: #8b949e;
                    }}

                    .bar-bg {{
                      fill: #30363d;
                    }}
                  }}
                </style>

                <text
                  x="20"
                  y="30"
                  class="title">
                  Most Used Languages
                </text>

                {''.join(rows)}

                <text
                  x="20"
                  y="{height - 10}"
                  class="footer">
                  Based on code-changing commits ·
                  Programming languages ≥ 1%
                </text>

              </svg>
              '''

          scores, total_commits = collect_language_stats()

          print(
              f"Analyzed code commits: {total_commits}"
          )

          for language, score in sorted(
              scores.items(),
              key=lambda item: item[1],
              reverse=True,
          ):
              percent = (
                  score / total_commits * 100
                  if total_commits
                  else 0
              )

              print(
                  f"{language:18} {percent:6.2f}%"
              )

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8",
          ) as output:
              output.write(
                  make_svg(scores, total_commits)
              )

          print(f"Generated: {OUTPUT_FILE}")
          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add language-stats.svg

          if git diff --cached --quiet; then
            echo "No changes in language stats."
            exit 0
          fi

          git commit -m "chore: update language statistics"
          git push
